# Mirsal (مِرسال) — Arabic/RTL secure file-sharing. Proxies to the container on
# localhost:8084 (compose publishes 127.0.0.1:8084 only).
#
# IMPORTANT: single server block on 80 AND 443, NO http->https redirect.
# The IT gateway forwards inbound HTTPS to this box on port 80, so a redirect
# causes an infinite loop (ERR_TOO_MANY_REDIRECTS). X-Forwarded-Proto is
# hardcoded https because users always arrive via the gateway over HTTPS.
# Matches the montham / motabe3 vhosts on this box.
#
# Install (the "ship it" flip — do NOT do this until launch is approved):
#   ln -s /etc/nginx/sites-available/mirsal /etc/nginx/sites-enabled/mirsal
#   nginx -t && systemctl reload nginx
# (copy this file to /etc/nginx/sites-available/mirsal first — see deploy/install.md)
server {
    listen 80;
    listen 443 ssl;
    server_name project4.system.mow.gov.sy;

    # Recover the true client IP for the app's per-IP login rate limiter.
    # The IT gateway (10.81.192.2) is the ONLY hop in front of us and it
    # OVERWRITES X-Real-IP with the real client IP (verified 2026-07-29: a
    # client-forged X-Real-IP was discarded and the true IP inserted), so
    # X-Real-IP is authoritative and unspoofable. We deliberately do NOT use
    # X-Forwarded-For as the real_ip source: the gateway *appends* to it, so a
    # client can prepend a forged value. Trusting only the gateway + reading
    # X-Real-IP makes $remote_addr the real client, and we forward that (not the
    # appendable XFF chain) to the app below.
    set_real_ip_from 10.81.192.2;
    real_ip_header X-Real-IP;

    ssl_certificate /etc/letsencrypt/live/project4.system.mow.gov.sy/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/project4.system.mow.gov.sy/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Uploads are capped at 100 MB app-side; allow headroom for multipart overhead.
    client_max_body_size 120M;

    # Stream large uploads straight through instead of buffering the whole body
    # to disk first (the app writes to a temp file + fsync itself), and give a
    # slow 100 MB upload room to finish.
    location /api/nodes/upload {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        client_body_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # real_ip-resolved client (forged prefix stripped)
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # real_ip-resolved client (forged prefix stripped)
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
